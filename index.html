<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martino-resto</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e03131">
  <style>
    :root { --primary: #e03131; --bg: #f8f9fa; --text: #2b2b2b; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Formulaire */
    form { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

    /* Recherche et Grille */
    #searchInput { margin-bottom: 20px; padding: 12px; border-radius: 25px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
    .restos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    
    /* Miniature */
    .resto-card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .resto-card:hover { transform: scale(1.02); }
    .mini-img { width: 100%; height: 120px; object-fit: cover; }
    .mini-body { padding: 10px; }
    .mini-title { font-weight: bold; font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-rating { color: #ff922b; font-size: 12px; }

    /* Vue Plein Écran (Overlay) */
    #detailOverlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: white; z-index: 1000; overflow-y: auto; padding-bottom: 50px;
    }
    .full-header { position: relative; width: 100%; height: 250px; background: #eee; }
    .full-header img { width: 100%; height: 100%; object-fit: cover; }
    .back-btn { 
      position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); 
      color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; 
    }
    .full-content { padding: 20px; }
    .full-info-row { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
    .action-link { 
      text-decoration: none; background: #f1f3f5; padding: 10px; 
      border-radius: 8px; color: var(--text); font-size: 14px; flex: 1; text-align: center;
    }
    .photo-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
    .gallery-img { width: 100%; border-radius: 8px; }
    .delete-area { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
  </style>
</head>
<body>

<div class="container" id="mainView">
  <header style="text-align:center"><h1>🍴 Martino-resto</h1></header>

  <form id="restoForm">
    <div class="form-group"><label>Nom du restaurant *</label><input type="text" id="name" required></div>
    <div class="form-group"><label>Adresse *</label><input type="text" id="address" required></div>
    <div class="form-row">
      <div class="form-group"><label>📞 Téléphone</label><input type="tel" id="phone"></div>
      <div class="form-group"><label>🌐 Site Web</label><input type="url" id="website"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Note</label><select id="rating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select></div>
      <div class="form-group"><label>Photos (plusieurs possibles)</label><input type="file" id="photos" accept="image/*" multiple></div>
    </div>
    <div class="form-group"><label>Commentaires</label><textarea id="comment" rows="2"></textarea></div>
    <button type="submit">Enregistrer</button>
  </form>

  <input type="text" id="searchInput" placeholder="🔍 Rechercher..." onkeyup="filterRestos()">
  <div id="restosList" class="restos-grid"></div>
</div>

<div id="detailOverlay">
  <button class="back-btn" onclick="closeDetails()">← Retour</button>
  <div id="detailContent"></div>
</div>

<script>
  let db;
  let allRestos = [];
  const request = indexedDB.open('RestoDB', 2); // Version 2 pour les nouveaux champs

  request.onupgradeneeded = e => {
    db = e.target.result;
    if (!db.objectStoreNames.contains('restaurants')) {
      db.createObjectStore('restaurants', { keyPath: 'id', autoIncrement: true });
    }
  };

  request.onsuccess = e => { db = e.target.result; loadRestos(); };

  document.getElementById('restoForm').addEventListener('submit', async e => {
    e.preventDefault();
    const files = document.getElementById('photos').files;
    const photoPromises = Array.from(files).map(file => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => resolve(ev.target.result);
      reader.readAsDataURL(file);
    }));
    
    const photosBase64 = await Promise.all(photoPromises);
    
    const data = {
      name: document.getElementById('name').value,
      address: document.getElementById('address').value,
      phone: document.getElementById('phone').value,
      website: document.getElementById('website').value,
      rating: document.getElementById('rating').value,
      comment: document.getElementById('comment').value,
      photos: photosBase64,
      date: new Date().toLocaleDateString('fr-FR')
    };

    const tx = db.transaction('restaurants', 'readwrite');
    tx.objectStore('restaurants').add(data);
    tx.oncomplete = () => { document.getElementById('restoForm').reset(); loadRestos(); };
  });

  function loadRestos() {
    allRestos = [];
    const store = db.transaction('restaurants').objectStore('restaurants');
    store.openCursor(null, 'prev').onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { allRestos.push(cursor.value); cursor.continue(); }
      else { displayRestos(allRestos); }
    };
  }

  function displayRestos(list) {
    const grid = document.getElementById('restosList');
    grid.innerHTML = list.map(r => `
      <div class="resto-card" onclick="openDetails(${r.id})">
        <img class="mini-img" src="${r.photos[0] || 'https://via.placeholder.com/150'}">
        <div class="mini-body">
          <p class="mini-title">${r.name}</p>
          <span class="mini-rating">${'⭐'.repeat(r.rating)}</span>
        </div>
      </div>
    `).join('');
  }

  window.openDetails = function(id) {
    const resto = allRestos.find(r => r.id === id);
    const overlay = document.getElementById('detailOverlay');
    const content = document.getElementById('detailContent');
    
    content.innerHTML = `
      <div class="full-header">
        <img src="${resto.photos[0] || ''}">
      </div>
      <div class="full-content">
        <h1>${resto.name}</h1>
        <p style="color:#777">Ajouté le ${resto.date}</p>
        <div class="mini-rating" style="font-size:20px">${'⭐'.repeat(resto.rating)}</div>
        
        <div class="full-info-row">
          <a class="action-link" href="tel:${resto.phone}">📞 Appeler</a>
          <a class="action-link" href="${resto.website}" target="_blank">🌐 Site Web</a>
          <a class="action-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(resto.address)}" target="_blank">🗺️ Carte</a>
        </div>

        <h3>📍 Adresse</h3>
        <p>${resto.address}</p>

        <h3>💬 Mon avis</h3>
        <p>${resto.comment || 'Aucun commentaire.'}</p>

        <h3>📸 Photos</h3>
        <div class="photo-gallery">
          ${resto.photos.map(p => `<img src="${p}" class="gallery-img">`).join('')}
        </div>

        <div class="delete-area">
          <button class="delete-btn" style="background:#ffc9c9; color:#e03131; border:none; padding:10px; border-radius:8px" onclick="deleteResto(${resto.id})">Supprimer cette fiche</button>
        </div>
      </div>
    `;
    overlay.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  window.closeDetails = () => {
    document.getElementById('detailOverlay').style.display = 'none';
    document.body.style.overflow = 'auto';
  };

  window.deleteResto = id => {
    if(confirm('Supprimer ?')) {
      const tx = db.transaction('restaurants', 'readwrite');
      tx.objectStore('restaurants').delete(id);
      tx.oncomplete = () => { closeDetails(); loadRestos(); };
    }
  };

  function filterRestos() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allRestos.filter(r => r.name.toLowerCase().includes(q) || r.address.toLowerCase().includes(q));
    displayRestos(filtered);
  }
</script>
</body>
</html>
